<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبيات الخليج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ffcc00;
            margin-top: 40px;
            font-size: 36px;
            border-bottom: 2px solid #ffcc00;
            display: inline-block;
            padding-bottom: 10px;
        }
        .playlist {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .song-card {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .song-title {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>شعبيات الخليج</h1>

    <div class="playlist">
        <div class="song-card">
            <div class="song-title">الأغنية الأولى</div>
            <audio controls>
                <source src="shaby1.mp3" type="audio/mpeg">
                متصفحك لا يدعم مشغل الصوت.
            </audio>
        </div>
    </div>

</body>
</html>
