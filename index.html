<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبيات الخليج</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #fff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        h1 {
            color: #ffcc00;
            margin-top: 40px;
            font-size: 36px;
            border-bottom: 2px solid #ffcc00;
            display: inline-block;
            padding-bottom: 10px;
        }
        .playlist {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .song-card {
            background-color: #2a2a35;
            padding: 15px;
            border-radius: 10px;
            width: 80%;
            max-width: 500px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .song-title {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        audio {
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>شعبيات الخليج</h1>

    <div class="playlist" id="playlist">
        <!-- الأغاني ستظهر هنا تلقائياً بفضل الكود الذكي بالأسفل -->
    </div>

    <script>
        // هنا نضع قائمة الأغاني.. كل ما ترفع أغنية جديدة، فقط أضف اسمها هنا في سطر جديد!
        const songs = [
            { title: "ابو فيصل - ياخساره", file: "unknown - ابو فيصل - ياخساره.mp3" },
            { title: "نواف الأسمري", file: "._نواف_الاسمري1_MP3_160K" },
            // عندما ترفع الأغنية رقم 3 ورقم 4 ورقم 50.. سنضيف أسطر تشبه هذه بالأسفل هنا بكل سهولة
        ];

        const playlistContainer = document.getElementById('playlist');

        songs.forEach(song => {
            const card = document.createElement('div');
            card.className = 'song-card';
            card.innerHTML = `
                <div class="song-title">${song.title}</div>
                <audio controls preload="none">
                    <source src="${song.file}" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوت.
                </audio>
            `;
            playlistContainer.appendChild(card);
        });
    </script>

</body>
</html>
