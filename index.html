<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شعبيات خليجية</title>
    <style>
        /* إعدادات الألوان المتطابقة مع الصورة */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #16161a; /* لون الخلفية الداكن جداً */
            color: #ffffff;
            margin: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 25px;
            color: #f1f1f1;
            text-align: center;
        }

        /* حاوية الأغاني الممتدة */
        .playlist-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px; /* المسافة بين البطاقات */
        }

        /* تصميم البطاقة المنفصلة لكل أغنية بناءً على الصورة */
        .song-card {
            background-color: #23232e; /* لون البطاقة المائل للرمادي الداكن */
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* عنوان الأغنية داخل البطاقة */
        .song-title {
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            color: #ffffff;
            line-height: 1.5;
        }

        /* مشغل الصوت الافتراضي داخل كل بطاقة */
        audio {
            width: 100%;
            outline: none;
        }
    </style>
</head>
<body>

    <h1>🎙️ شعبيات خليجية 🎙️</h1>

    <!-- هنا سيتم توليد الـ 35 بطاقة تلقائياً بالشكل المطلوب -->
    <div class="playlist-container" id="songs-container"></div>

    <script>
        // قائمة الـ 35 أغنية (قم بتعديل العنوان والـ src لملفاتك الحقيقية)
        const songs = [
            { title: "ابو فيصل - ياخساره", src: "audio/abu_faisal.mp3" },
            { title: "نواف الأسمري", src: "audio/nawaf.mp3" },
            { title: "نوادر منوعات شعبي - نواف الأسمري", src: "audio/nawaf_mix.mp3" },
            { title: "اخ الذي كسر الصوت", src: "audio/break_sound.mp3" },
            { title: "كسرات لزلايب موسى الزهراني والباكستاني منير البلوشي", src: "audio/kasrat.mp3" },
            // يمكنك تكرار هذا السطر وتغيير المسمى والملف حتى تصل إلى 35 أغنية
            { title: "أغنية شعبية رقم 6", src: "audio/song6.mp3" },
            { title: "أغنية شعبية رقم 7", src: "audio/song7.mp3" },
            { title: "أغنية شعبية رقم 8", src: "audio/song8.mp3" },
            { title: "أغنية شعبية رقم 9", src: "audio/song9.mp3" },
            { title: "أغنية شعبية رقم 10", src: "audio/song10.mp3" },
            { title: "أغنية شعبية رقم 11", src: "audio/song11.mp3" },
            { title: "أغنية شعبية رقم 12", src: "audio/song12.mp3" },
            { title: "أغنية شعبية رقم 13", src: "audio/song13.mp3" },
            { title: "أغنية شعبية رقم 14", src: "audio/song14.mp3" },
            { title: "أغنية شعبية رقم 15", src: "audio/song15.mp3" },
            { title: "أغنية شعبية رقم 16", src: "audio/song16.mp3" },
            { title: "أغنية شعبية رقم 17", src: "audio/song17.mp3" },
            { title: "أغنية شعبية رقم 18", src: "audio/song18.mp3" },
            { title: "أغنية شعبية رقم 19", src: "audio/song19.mp3" },
            { title: "أغنية شعبية رقم 20", src: "audio/song20.mp3" },
            { title: "أغنية شعبية رقم 21", src: "audio/song21.mp3" },
            { title: "أغنية شعبية رقم 22", src: "audio/song22.mp3" },
            { title: "أغنية شعبية رقم 23", src: "audio/song23.mp3" },
            { title: "أغنية شعبية رقم 24", src: "audio/song24.mp3" },
            { title: "أغنية شعبية رقم 25", src: "audio/song25.mp3" },
            { title: "أغنية شعبية رقم 26", src: "audio/song26.mp3" },
            { title: "أغنية شعبية رقم 27", src: "audio/song27.mp3" },
            { title: "أغنية شعبية رقم 28", src: "audio/song28.mp3" },
            { title: "أغنية شعبية رقم 29", src: "audio/song29.mp3" },
            { title: "أغنية شعبية رقم 30", src: "audio/song30.mp3" },
            { title: "أغنية شعبية رقم 31", src: "audio/song31.mp3" },
            { title: "أغنية شعبية رقم 32", src: "audio/song32.mp3" },
            { title: "أغنية شعبية رقم 33", src: "audio/song33.mp3" },
            { title: "أغنية شعبية رقم 34", src: "audio/song34.mp3" },
            { title: "أغنية شعبية رقم 35", src: "audio/song35.mp3" }
        ];

        const container = document.getElementById('songs-container');

        // توليد البطاقات تلقائياً في الصفحة لضمان نظافة الكود وسرعته
        songs.forEach(song => {
            const card = document.createElement('div');
            card.className = 'song-card';

            card.innerHTML = `
                <div class="song-title">${song.title}</div>
                <audio controls preload="none">
                    <source src="${song.src}" type="audio/mpeg">
                    متصفحك لا يدعم مشغل الصوت.
                </audio>
            `;
            container.appendChild(card);
        });

        // كود ذكي: يضمن أنه عند تشغيل أغنية، تتوقف بقية الأغاني تلقائياً لمنع التداخل
        const allAudios = document.querySelectorAll('audio');
        allAudios.forEach(audio => {
            audio.addEventListener('play', () => {
                allAudios.forEach(otherAudio => {
                    if (otherAudio !== audio) {
                        otherAudio.pause();
                    }
                });
            });
        });
    </script>
</body>
</html>
